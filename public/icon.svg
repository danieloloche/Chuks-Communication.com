<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="55%" stop-color="#081426" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Vibrant Gold / Amber Gradient for Hardware Pins -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Phone Glass / Screen Gradient -->
    <linearGradient id="screenGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#091322" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle with 116px corner radius) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#neonBorder)" stroke-width="4" stroke-opacity="0.45" />

  <!-- Ambient Glow Behind Device -->
  <circle cx="256" cy="225" r="140" fill="#0284c7" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="256" cy="225" r="90" fill="#f59e0b" opacity="0.15" filter="url(#softGlow)" />

  <!-- Technical Circuit Board Traces & Micro-Nodes -->
  <g opacity="0.32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Top-Left Circuit -->
    <path d="M 68 110 L 125 110 L 155 140" />
    <circle cx="68" cy="110" r="4.5" fill="#38bdf8" />
    <circle cx="155" cy="140" r="3.5" fill="#38bdf8" />
    <path d="M 95 72 L 95 95 L 125 110" stroke-width="2" />

    <!-- Top-Right Circuit -->
    <path d="M 444 110 L 387 110 L 357 140" />
    <circle cx="444" cy="110" r="4.5" fill="#38bdf8" />
    <circle cx="357" cy="140" r="3.5" fill="#38bdf8" />
    <path d="M 417 72 L 417 95 L 387 110" stroke-width="2" />

    <!-- Bottom-Left Circuit (Gold accents for Down Board / Flex cables) -->
    <path d="M 68 375 L 125 375 L 155 345" stroke="#f59e0b" />
    <circle cx="68" cy="375" r="4.5" fill="#f59e0b" />

    <!-- Bottom-Right Circuit (Gold accents) -->
    <path d="M 444 375 L 387 375 L 357 345" stroke="#f59e0b" />
    <circle cx="444" cy="375" r="4.5" fill="#f59e0b" />
  </g>

  <!-- Central Smartphone / OLED Screen Chassis -->
  <g id="phone-chassis">
    <!-- Outer Metal Phone Frame -->
    <rect x="136" y="68" width="240" height="318" rx="38" fill="#091424" stroke="url(#cyanGrad)" stroke-width="6" />

    <!-- Screen Bezel Interior -->
    <rect x="146" y="78" width="220" height="298" rx="30" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2" />

    <!-- Screen Glass Sheen Reflection -->
    <path d="M 148 78 L 290 78 L 195 374 L 148 374 Z" fill="url(#glassReflection)" />

    <!-- Top Speaker Ear-piece & Front Camera Punch Hole -->
    <rect x="232" y="87" width="48" height="5" rx="2.5" fill="#334155" />
    <circle cx="256" cy="104" r="4.5" fill="#0284c7" stroke="#0f172a" stroke-width="1.5" />

    <!-- Hardware Pin Connectors (Top & Bottom Flex Ribbon) -->
    <g fill="url(#goldGrad)">
      <rect x="175" y="62" width="8" height="9" rx="2" />
      <rect x="195" y="62" width="8" height="9" rx="2" />
      <rect x="309" y="62" width="8" height="9" rx="2" />
      <rect x="329" y="62" width="8" height="9" rx="2" />

      <rect x="175" y="383" width="8" height="9" rx="2" />
      <rect x="195" y="383" width="8" height="9" rx="2" />
      <rect x="309" y="383" width="8" height="9" rx="2" />
      <rect x="329" y="383" width="8" height="9" rx="2" />
    </g>
  </g>

  <!-- Central Emblem: Stylized Modern "C" (Chuks) + Microchip + Lightning Core -->
  <g id="brand-emblem" transform="translate(0, 5)">
    <!-- Microchip Center Plate -->
    <rect x="206" y="175" width="100" height="100" rx="18" fill="#0b1b33" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Chip Pins on sides -->
    <g fill="url(#goldGrad)">
      <!-- Left pins -->
      <rect x="194" y="190" width="12" height="5" rx="1.5" />
      <rect x="194" y="206" width="12" height="5" rx="1.5" />
      <rect x="194" y="222" width="12" height="5" rx="1.5" />
      <rect x="194" y="238" width="12" height="5" rx="1.5" />
      <rect x="194" y="254" width="12" height="5" rx="1.5" />

      <!-- Right pins -->
      <rect x="306" y="190" width="12" height="5" rx="1.5" />
      <rect x="306" y="206" width="12" height="5" rx="1.5" />
      <rect x="306" y="222" width="12" height="5" rx="1.5" />
      <rect x="306" y="238" width="12" height="5" rx="1.5" />
      <rect x="306" y="254" width="12" height="5" rx="1.5" />
    </g>

    <!-- Bold Stylized Letter "C" Curve (for CHUKS) in Electric Cyan -->
    <path d="M 282 195 C 242 195 224 212 224 235 C 224 258 242 275 282 275 C 294 275 301 272 304 269 L 304 252 L 282 252 L 282 242 L 316 242 L 316 279 C 307 284 296 287 282 287 C 232 287 210 263 210 235 C 210 207 232 183 282 183 C 296 183 307 186 316 191 L 304 201 C 301 198 294 195 282 195 Z" fill="url(#cyanGrad)" />

    <!-- Center Lightning / Electronics Energy Spark in Gold -->
    <polygon points="266,160 242,228 266,228 240,296 288,218 262,218" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <!-- Premium Typography Section -->
  <g id="brand-typography">
    <!-- Brand Name: CHUKS -->
    <text x="256" y="435" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="36" letter-spacing="4">
      CHUKS STORE
    </text>

    <!-- Subtitle: PHONE PARTS & ACCESSORIES -->
    <text x="256" y="462" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="13" letter-spacing="5">
      GWAGWALADA • ABUJA
    </text>

    <!-- Verification / Genuine Badge Dots -->
    <circle cx="140" cy="458" r="3" fill="#f59e0b" />
    <circle cx="372" cy="458" r="3" fill="#f59e0b" />
  </g>
</svg>
